
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swaple</title>
  
  <!-- Move your link tag right here, inside the head block! -->
  <link rel="stylesheet" href="/style.css" /> 
</head>
<body>

  <div id="game-container">
    <h1>Word Drop</h1>
    <div id="timer-display">Time: 60s</div>
    
    <!-- This is where your empty slots will appear -->
    <div id="slots-board"></div>
    
    <!-- NEW: This is the box where you type your final guess -->
    <div id="guess-zone" style="margin-bottom: 30px; width: 100%;">
      <input type="text" id="solve-input" placeholder="Type whole word..." maxlength="10" style="padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #3a3a3c; background: #1a1a1b; color: white; width: 60%; text-transform: uppercase; margin-right: 10px;">
      <button id="solve-btn" style="width: auto; padding: 10px 20px;">Solve!</button>
    </div>
    
    <!-- This shows the single letter waiting to be placed -->
    <div id="active-letter-zone">
      <p>Next Letter:</p>
      <div id="current-letter">?</div>
      <button id="swap-btn">Swap Letter (5 left)</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
